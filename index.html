<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a2340">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Pictos</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:Verdana,"Segoe UI",Arial,sans-serif;background:#eef2f8;color:#1a2340;font-size:15px;overscroll-behavior:none}
button,input,select{font-family:inherit;font-size:inherit}
#app{display:flex;flex-direction:column;height:100%}
header{background:#1a2340;color:#fff;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;display:flex;align-items:center;gap:8px}
header h1{font-size:17px;margin:0;flex:1}
#zone{flex:1;overflow-y:auto;padding:10px 10px 90px;-webkit-overflow-scrolling:touch}
.btn{border:1.5px solid #c5d0e6;background:#fff;color:#1a2340;border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px;cursor:pointer;min-height:44px}
.btn.bleu{background:#4f86c6;border-color:#4f86c6;color:#fff}
.btn.vert{background:#1e8449;border-color:#1e8449;color:#fff}
.btn.rouge{background:#fff;border-color:#e74c3c;color:#e74c3c}
.btn.petit{padding:6px 10px;min-height:34px;font-size:12px}
.btn.hd{background:none;border:1px solid #3a4f70;color:#cfe1ff}
.lien{border:none;background:none;color:#4f86c6;font-weight:700;cursor:pointer;padding:6px 4px}
.lien.rouge{color:#e74c3c}
.carte{background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(26,35,64,.08);padding:10px;margin-bottom:10px}
.petit{font-size:12px;color:#667}
#rech{position:relative;margin-bottom:8px}
#rech input{width:100%;padding:12px 14px;border:1.5px solid #c5d0e6;border-radius:12px;background:#fff}
#sugg{position:absolute;left:0;right:0;top:100%;z-index:30;background:#fff;border:1.5px solid #c5d0e6;border-radius:10px;margin-top:2px;box-shadow:0 6px 18px rgba(26,35,64,.15);display:none;overflow:hidden}
#sugg div{padding:12px 14px;border-bottom:1px solid #f0f3f9;font-size:15px}
#sugg div:active{background:#eaf1fb}
.fil{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:13px;margin-bottom:8px}
.fil button{border:none;background:#fff;border-radius:8px;padding:6px 10px;font-weight:700;color:#4f86c6;font-size:13px}
.tuiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.tuile{background:#fff;border-radius:12px;padding:14px 10px;font-weight:700;font-size:14px;text-align:left;border:none;box-shadow:0 1px 4px rgba(26,35,64,.08);cursor:pointer;color:#1a2340;word-break:break-word}
.tuile small{display:block;font-weight:500;color:#889;margin-top:3px}
.tuile.nouv{background:#eaf1fb;color:#4f86c6}
.outils{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center}
.zoom{display:flex;align-items:center;gap:6px;margin-left:auto;font-size:12px;color:#667}
.zoom input{width:90px}
.grille{display:grid;grid-template-columns:repeat(var(--cols,3),1fr);gap:8px}
.im{background:#fff;border-radius:12px;padding:6px;position:relative;box-shadow:0 1px 4px rgba(26,35,64,.08);border:2.5px solid transparent;cursor:pointer;min-width:0}
.im.on{border-color:#4f86c6;background:#f1f6fd}
.im .ph{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;position:relative}
.im img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none}
.im .nm{font-size:11px;text-align:center;margin-top:4px;line-height:1.2;max-height:2.4em;overflow:hidden;word-break:break-word}
.im .ed{position:absolute;top:2px;right:2px;width:30px;height:30px;border-radius:50%;border:none;background:rgba(255,255,255,.9);box-shadow:0 1px 3px rgba(0,0,0,.25);font-size:14px;padding:0}
.im .ord{position:absolute;top:2px;left:2px;min-width:24px;height:24px;border-radius:12px;background:#4f86c6;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px}
.im .cx{position:absolute;bottom:26px;right:2px;width:30px;height:30px;border-radius:50%;border:none;background:#fff;color:#e74c3c;font-weight:900;box-shadow:0 1px 3px rgba(0,0,0,.25);font-size:15px;padding:0}
.im .cx.on{background:#e74c3c;color:#fff}
.croix{position:absolute;inset:6%;pointer-events:none}
.croix:before,.croix:after{content:"";position:absolute;left:-4%;right:-4%;top:50%;height:9%;background:#e00000;border-radius:6px;transform:rotate(45deg)}
.croix:after{transform:rotate(-45deg)}
#bas{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #dfe5f1;display:flex;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:20}
#bas .btn{flex:1;padding:12px 6px}
#bas .btn.grand{flex:2}
.plein{position:fixed;inset:0;background:#eef2f8;z-index:40;display:none;flex-direction:column}
.plein>header{background:#1a2340}
.plein .corps{flex:1;overflow-y:auto;padding:10px 10px 30px}
.sel-item{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:8px;margin-bottom:8px;box-shadow:0 1px 3px rgba(26,35,64,.08)}
.sel-item .th{width:56px;height:56px;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center}
.sel-item .th img{max-width:100%;max-height:100%;object-fit:contain}
.sel-item .mid{flex:1;min-width:0}
.sel-item .nom{font-weight:700;font-size:13px;word-break:break-word}
.sel-item input.nm{width:100%;padding:6px;border:1.5px solid #c5d0e6;border-radius:8px;font-size:13px}
.rang{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap;align-items:center}
.mini{min-width:36px;height:36px;border:1.5px solid #c5d0e6;background:#fff;border-radius:8px;font-weight:700;padding:0 6px;font-size:14px}
.mini.rouge{color:#e74c3c;border-color:#e74c3c}
.mini.on{background:#e74c3c;color:#fff;border-color:#e74c3c}
.fmt{display:flex;gap:6px;margin-bottom:10px}
.fmt .btn{flex:1;line-height:1.2;padding:8px 4px;font-size:13px}
.fmt .btn small{display:block;font-weight:500;font-size:10px}
#voile{position:fixed;inset:0;background:rgba(26,35,64,.5);z-index:60;display:none;align-items:flex-end;justify-content:center}
#boite{background:#fff;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:520px;max-height:88%;overflow-y:auto}
@media(min-width:600px){#voile{align-items:center}#boite{border-radius:16px}}
#boite h3{margin:0 0 10px;font-size:16px}
#boite label{display:block;font-size:12px;font-weight:700;margin:10px 0 4px;color:#556}
#boite input[type=text],#boite select{width:100%;padding:11px;border:1.5px solid #c5d0e6;border-radius:10px;background:#fff}
#boite .bt{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
#boite .menu button{display:block;width:100%;text-align:left;background:#f4f7fc;border:none;border-radius:10px;padding:14px;margin-bottom:8px;font-weight:700;font-size:15px;color:#1a2340}
#boite .menu button.rouge{color:#e74c3c}
#msg{position:fixed;left:10px;right:10px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:70;pointer-events:none}
.toast{background:#1a2340;color:#fff;border-radius:12px;padding:12px 14px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.25);pointer-events:auto}
.toast.err{background:#c0392b}
.damier{background:conic-gradient(#e6e6e6 25%,#fff 0 50%,#e6e6e6 0 75%,#fff 0) 0 0/20px 20px;border-radius:10px;padding:8px;text-align:center}
.damier canvas{max-width:100%;max-height:46vh}
.vide{text-align:center;color:#889;padding:24px 10px;font-size:14px}
.tmp{display:inline-block;background:#fff3cd;color:#8a6d00;border-radius:6px;padding:1px 6px;font-size:10px;font-weight:700}
.rtab{display:flex;gap:6px;margin-bottom:10px}
.rtab .btn{flex:1}
</style>
</head>
<body>
<div id="app">
  <header><h1>🖼 Pictos</h1><button class="btn hd petit" id="bMenu">⋮ Menu</button></header>
  <div id="zone"></div>
  <div id="bas">
    <button class="btn bleu" id="bAjout">＋ Ajouter</button>
    <button class="btn vert grand" id="bSel">📋 Ma sélection</button>
  </div>
</div>
<div class="plein" id="feuille"></div>
<div class="plein" id="ecran2"></div>
<div id="voile"><div id="boite"></div></div>
<div id="msg"></div>
<datalist id="noms"></datalist>
<input type="file" id="fPhoto" accept="image/*" capture="environment" hidden>
<input type="file" id="fGalerie" accept="image/*" multiple hidden>
<input type="file" id="fJson" accept=".json,application/json" hidden>
<script src="docx.js"></script>
<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s);};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];});}
function norm(s){return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[’']/g," ").replace(/\s+/g," ").trim();}

/* ---------- Stockage ---------- */
var DB=null,MEMOIRE_SEULE=false;
function ouvrirDB(){return new Promise(function(ok){
  try{var rq=indexedDB.open("pictos_tel_v1",1);
    rq.onupgradeneeded=function(){var d=rq.result;d.createObjectStore("images",{keyPath:"id"});d.createObjectStore("meta");};
    rq.onsuccess=function(){DB=rq.result;ok(true);};rq.onerror=function(){ok(false);};
  }catch(e){ok(false);}
});}
function dbReq(store,mode,fn){return new Promise(function(ok,ko){
  if(!DB){ok(null);return;}
  try{var tx=DB.transaction(store,mode),st=tx.objectStore(store),r=fn(st);
    tx.oncomplete=function(){ok(r&&r.result!==undefined?r.result:null);};tx.onerror=function(){ko(tx.error);};tx.onabort=function(){ko(tx.error);};}
  catch(e){ko(e);}
});}
function putImg(r){var o={id:r.id,nom:r.nom,type:r.type,w:r.w,h:r.h,data:r.data,dossier:r.dossier||"",src:r.src||""};return dbReq("images","readwrite",function(s){return s.put(o);}).catch(erreurStock);}
function delImg(id){return dbReq("images","readwrite",function(s){return s.delete(id);}).catch(erreurStock);}
function saveMeta(){return dbReq("meta","readwrite",function(s){return s.put(META,"meta");}).catch(erreurStock);}
function erreurStock(e){msg("⚠️ L'enregistrement a échoué ("+(e&&e.message||e)+"). Fais une sauvegarde (menu ⋮) pour ne rien perdre.",true);}

/* ---------- Données ---------- */
var IMGS=new Map(),META={dossiers:{},selections:{},recherches:[]},TMP=new Map();
var sel=[];                          // [{id,n,croix}]
var cur="",q="",lim=120,format="petits",cols=3,qNet="";
try{var c0=parseInt(localStorage.getItem("pt_cols"));if(c0>=2&&c0<=6)cols=c0;var f0=localStorage.getItem("pt_format");if(f0)format=f0;}catch(e){}
var URLS=new Map();
function b64Blob(r){var bin=atob(r.data),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:r.type||"image/png"});}
function src(r){var k=r.id+"|"+r.data.length,u=URLS.get(k);if(!u){u=URL.createObjectURL(b64Blob(r));URLS.set(k,u);}return u;}
function rec(id){return TMP.get(id)||IMGS.get(id)||null;}

function fils(p){return Object.keys(META.dossiers).map(function(k){return META.dossiers[k];}).filter(function(d){return d.parent===p;}).sort(function(a,b){return a.nom.localeCompare(b.nom,"fr");});}
function descend(id){var L=[id];fils(id).forEach(function(f){L=L.concat(descend(f.id));});return L;}
function cheminDe(id){var L=[];while(id&&META.dossiers[id]){L.unshift(META.dossiers[id]);id=META.dossiers[id].parent;}return L;}
function etiquette(id){return cheminDe(id).map(function(d){return d.nom;}).join(" › ");}
function nbImg(id){var S={};descend(id).forEach(function(x){S[x]=1;});var n=0;IMGS.forEach(function(r){if(S[r.dossier])n++;});return n;}
function plats(exclure){var ex={};if(exclure)descend(exclure).forEach(function(x){ex[x]=1;});return Object.keys(META.dossiers).filter(function(k){return !ex[k];}).map(function(k){return{id:k,label:etiquette(k)};}).sort(function(a,b){return a.label.localeCompare(b.label,"fr");});}
function nvId(){return "d"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);}

async function charger(){
  var ok=await ouvrirDB();if(!ok)MEMOIRE_SEULE=true;
  var m=ok?await dbReq("meta","readonly",function(s){return s.get("meta");}):null;
  if(m){META=m;if(!META.dossiers)META.dossiers={};if(!META.selections)META.selections={};if(!META.recherches)META.recherches=[];
    var all=await dbReq("images","readonly",function(s){return s.getAll();});(all||[]).forEach(function(r){IMGS.set(r.id,r);});
  }else{
    $("#zone").innerHTML='<div class="vide">⏳ Premier démarrage : chargement de tes pictos…<br>(une seule fois)</div>';
    var rep=await fetch("data.json");var d=await rep.json();
    META={dossiers:d.dossiers,selections:{},recherches:[]};
    Object.keys(d.images).forEach(function(k){var o=d.images[k];IMGS.set(k,{id:k,nom:o.nom,type:o.type,w:o.w,h:o.h,data:o.data,dossier:o.dossier||"",src:""});});
    if(ok){await dbReq("images","readwrite",function(s){IMGS.forEach(function(r){s.put(r);});return null;}).catch(erreurStock);await saveMeta();}
  }
  if(navigator.storage&&navigator.storage.persist){try{navigator.storage.persist();}catch(e){}}
  majNoms();
}
var nomsT=null;
function majNoms(){clearTimeout(nomsT);nomsT=setTimeout(function(){var S={};IMGS.forEach(function(r){if(r.nom)S[r.nom]=1;});Object.keys(META.dossiers).forEach(function(k){S[META.dossiers[k].nom]=1;});(META.recherches||[]).forEach(function(x){S[x]=1;});
  $("#noms").innerHTML=Object.keys(S).sort(function(a,b){return a.localeCompare(b,"fr");}).slice(0,1500).map(function(n){return'<option value="'+esc(n)+'">';}).join("");},400);}

/* ---------- Messages & fenêtres ---------- */
var msgT=null;
function msg(t,err){var e=$("#msg");e.innerHTML=t?'<div class="toast'+(err?" err":"")+'">'+esc(t)+'</div>':"";clearTimeout(msgT);if(t&&!err)msgT=setTimeout(function(){e.innerHTML="";},5000);}
function fenetre(o){return new Promise(function(res){
  var v=$("#voile"),b=$("#boite"),h='<h3>'+esc(o.titre||"")+'</h3>';
  if(o.texte)h+='<div class="petit" style="line-height:1.5;white-space:pre-wrap">'+esc(o.texte)+'</div>';
  (o.champs||[]).forEach(function(c,i){
    h+='<label>'+esc(c.label||"")+'</label>';
    if(c.type==="select"){h+='<select data-i="'+i+'">'+c.options.map(function(p){return'<option value="'+esc(p[0])+'"'+(p[0]===c.value?" selected":"")+'>'+esc(p[1])+'</option>';}).join("")+'</select>';}
    else h+='<input type="text" data-i="'+i+'" list="noms" autocomplete="on" spellcheck="true" value="'+esc(c.value||"")+'"'+(c.ph?' placeholder="'+esc(c.ph)+'"':"")+'>';
  });
  h+='<div class="bt">'+(o.pasAnnuler?"":'<button class="btn" id="fNon">Annuler</button>')+'<button class="btn vert" id="fOui">'+esc(o.ok||"OK")+'</button></div>';
  b.innerHTML=h;v.style.display="flex";
  var champs=b.querySelectorAll("[data-i]");
  if(champs[0]&&champs[0].tagName==="INPUT"){champs[0].focus();champs[0].select();}
  function fin(val){v.style.display="none";b.innerHTML="";v.onclick=null;res(val);}
  function valeurs(){var r=[];champs.forEach(function(x){r.push(x.value);});return r;}
  b.querySelector("#fOui").onclick=function(){fin(valeurs());};
  var n=b.querySelector("#fNon");if(n)n.onclick=function(){fin(null);};
  v.onclick=function(e){if(e.target===v&&!o.pasAnnuler)fin(null);};
  b.onkeydown=function(e){if(e.key==="Enter"&&e.target.tagName==="INPUT")fin(valeurs());};
  if(o.surChamp)champs.forEach(function(x){x.onchange=function(){o.surChamp(champs);};});
});}
async function demander(titre,defaut,texte){var r=await fenetre({titre:titre,texte:texte,champs:[{label:"",value:defaut||""}]});return r?String(r[0]||"").trim():null;}
async function confirmer(titre,texte,ok){return !!(await fenetre({titre:titre,texte:texte,ok:ok||"Confirmer"}));}
function menu(titre,items){return new Promise(function(res){
  var v=$("#voile"),b=$("#boite");b.innerHTML='<h3>'+esc(titre)+'</h3><div class="menu">'+items.map(function(it,i){return'<button data-m="'+i+'"'+(it[2]?' class="rouge"':"")+'>'+esc(it[0])+'</button>';}).join("")+'</div><div class="bt"><button class="btn" id="fNon">Fermer</button></div>';
  v.style.display="flex";
  function fin(x){v.style.display="none";b.innerHTML="";v.onclick=null;res(x);if(x!==null&&items[x][1])items[x][1]();}
  b.onclick=function(e){var m=e.target.closest("[data-m]");if(m){b.onclick=null;fin(+m.getAttribute("data-m"));}else if(e.target.id==="fNon"){b.onclick=null;fin(null);}};
  v.onclick=function(e){if(e.target===v){b.onclick=null;fin(null);}};
});}
/* choisit un dossier existant (ou en crée un nouveau dedans) ; renvoie id, "" (à classer) ou null */
async function choisirDossier(titre,exclure,defaut){
  var opts=[["","(à la racine / à classer)"]].concat(plats(exclure).map(function(p){return[p.id,p.label];}));
  var r=await fenetre({titre:titre,champs:[{label:"Dossier",type:"select",value:defaut||"",options:opts},{label:"…ou crée un nouveau dossier à l'intérieur (facultatif)",value:"",ph:"Nom du nouveau dossier"}],ok:"Valider"});
  if(!r)return null;var id=r[0],nom=(r[1]||"").trim();
  if(nom){var n=nvId();META.dossiers[n]={id:n,nom:nom,parent:id};await saveMeta();majNoms();id=n;}
  return id;
}

/* ---------- Écran principal ---------- */
function sugg(prefix){
  var p=norm(prefix);if(p.length<1)return[];var S={},A=[],B=[];
  function add(n){if(!n)return;var k=norm(n);if(S[k])return;S[k]=1;if(k.indexOf(p)===0)A.push(n);else if(k.indexOf(p)>=0)B.push(n);}
  (META.recherches||[]).forEach(add);IMGS.forEach(function(r){add(r.nom);});Object.keys(META.dossiers).forEach(function(k){add(META.dossiers[k].nom);});
  A.sort(function(a,b){return a.length-b.length;});return A.concat(B).slice(0,6);
}
function liste(){
  var L=[];
  if(q){var n=norm(q);IMGS.forEach(function(r){var d=r.dossier?etiquette(r.dossier):"";if(norm(r.nom).indexOf(n)>=0||norm(d).indexOf(n)>=0)L.push(r);});}
  else if(cur==="__tout"){IMGS.forEach(function(r){L.push(r);});}
  else if(cur==="__none"){IMGS.forEach(function(r){if(!r.dossier||!META.dossiers[r.dossier])L.push(r);});}
  else if(cur){IMGS.forEach(function(r){if(r.dossier===cur)L.push(r);});}
  L.sort(function(a,b){return String(a.nom).localeCompare(String(b.nom),"fr");});return L;
}
function ordreSel(id){for(var i=0;i<sel.length;i++)if(sel[i].id===id)return i+1;return 0;}
function carte(r){
  var o=ordreSel(r.id),e=o?sel[o-1]:null;
  return'<div class="im'+(o?" on":"")+'" data-id="'+esc(r.id)+'"><div class="ph"><img loading="lazy" src="'+src(r)+'" alt="">'+(e&&e.croix?'<div class="croix"></div>':"")+'</div>'
   +(o?'<div class="ord">'+o+'</div><button class="cx'+(e.croix?" on":"")+'" data-a="croix" title="Croix rouge">✖</button>':"")
   +'<button class="ed" data-a="edit" title="Modifier">✎</button><div class="nm">'+esc(r.nom||"(sans nom)")+'</div></div>';
}
function renderBiblio(){
  var z=$("#zone"),top=z.scrollTop,h="";
  h+='<div id="rech"><input type="search" id="qq" list="" autocomplete="off" spellcheck="true" placeholder="🔍 Chercher un picto…" value="'+esc(q)+'"><div id="sugg"></div></div>';
  var isReal=cur&&cur!=="__tout"&&cur!=="__none"&&META.dossiers[cur];
  if(cur&&!q){
    h+='<div class="fil"><button data-a="aller" data-v="">🏠 Accueil</button>';
    if(isReal)cheminDe(cur).forEach(function(d){h+='<span>›</span><button data-a="aller" data-v="'+d.id+'">'+esc(d.nom)+'</button>';});
    else h+='<span>›</span><b>'+(cur==="__tout"?"Tout":"À classer")+'</b>';
    h+='</div>';
  }
  if(!q){
    if(!cur||isReal){
      var F=fils(cur||"");

function lireFichier(f){return new Promise(function(ok,ko){var r=new FileReader();r.onload=function(){ok(r.result);};r.onerror=ko;r.readAsDataURL(f);});}

async function reduire(f,maxi){
  var url=await lireFichier(f),im=await chargerImg(url);var w=im.naturalWidth,h=im.naturalHeight;
  var k=Math.min(1,maxi/Math.max(w,h)),W=Math.max(1,Math.round(w*k)),H=Math.max(1,Math.round(h*k));
  var cv=document.createElement("canvas");cv.width=W;cv.height=H;var cx=cv.getContext("2d");cx.drawImage(im,0,0,W,H);
  var alpha=false;if(f.type!=="image/jpeg"){var px=cx.getImageData(0,0,W,H).data;for(var i=3;i<px.length;i+=4){if(px[i]<250){alpha=true;break;}}}
  var type,data;

  else{cx.globalCompositeOperation="destination-over";cx.fillStyle="#fff";cx.fillRect(0,0,W,H);type="image/jpeg";data=cv.toDataURL("image/jpeg",0.88).split(",")[1];}

}
async function idImage(b64){var bin=atob(b64),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);

  var e=$("#ecran2");e.style.display="flex";
  e.innerHTML='<header><button class="btn hd petit" data-f="annuler">← Annuler</button><h1>✂️ Enlever le fond</h1></header><div class="corps">'
   +'<div class="damier"><canvas id="cvF"></canvas></div>'
   +'<div class="carte" style="margin-top:10px"><label class="petit" style="font-weight:700">Force : <span id="tolv">'+FOND.tol+'</span> <span class="petit">(augmente si du fond reste ; baisse si le sujet est mangé)</span></label><input type="range" id="tolF" min="5" max="120" value="'+FOND.tol+'" style="width:100%"></div>'
   +'<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn vert" data-f="valider" style="flex:1">✅ Valider</button><button class="btn" data-f="ia" style="flex:1">✨ Détection du contour</button></div>'
   +'<div class="petit" style="margin-top:8px" id="fInfo">« Simple » marche très bien sur un fond clair et uni. « Détection du contour » marche sur tous les fonds : elle télécharge environ 50 Mo la première fois (connexion internet nécessaire).</div></div>';
  recalcFond();

function couleurFond(d,W,H){
  var B={},best=null,bn=0;function add(i){var r=d[i],g=d[i+1],b=d[i+2],k=(r>>4)+","+(g>>4)+","+(b>>4);var o=B[k]||(B[k]={n:0,r:0,g:0,b:0});o.n++;o.r+=r;o.g+=g;o.b+=b;if(o.n>bn){bn=o.n;best=o;}}

function recalcFond(){

    }
    for(var k of Object.keys(d.images)){var o=d.images[k],dos=o.dossier||"";
      if(d.format==="prtnd-pictos-1"&&o.categorie){if(!map[o.categorie]){var ci=Object.keys(META.dossiers).find(function(z){return META.dossiers[z].nom===o.categorie&&META.dossiers[z].parent==="";});if(!ci){ci=nvId();META.dossiers[ci]={id:ci,nom:o.categorie,parent:""};}map[o.categorie]={id:ci};}
        var m=map[o.categorie];if(o.sous){if(!m[o.sous]){var si=nvId();META.dossiers[si]={id:si,nom:o.sous,parent:m.id};m[o.sous]=si;}dos=m[o.sous];}else dos=m.id;}
      var r={id:k,nom:o.nom||"",type:o.type,w:o.w,h:o.h,data:o.data,dossier:dos,src:o.src||""};IMGS.set(k,r);await putImg(r);}
    Object.keys(d.selections||{}).forEach(function(k){META.selections[k]=(d.selections[k]||[]).map(function(x){return{id:x.id,n:x.n||1,croix:!!x.croix};});});
    await saveMeta();majNoms();renderTout();msg("✅ Sauvegarde importée ("+n+" images).");
  }catch(err){msg("⚠️ Import impossible : "+err.message,true);}
};

if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}

  renderBiblio();
  if(MEMOIRE_SEULE)msg("⚠️ Ton navigateur n'autorise pas l'enregistrement ici : les modifications seront perdues à la fermeture. Fais une sauvegarde avant de quitter.",true);
}).catch(function(e){$("#zone").innerHTML='<div class="vide">⚠️ Démarrage impossible : '+esc(e&&e.message||e)+'</div>';});
window.__pt={sel:function(){return sel;},IMGS:IMGS,META:function(){return META;},genererWord:genererWord};
})();
